  .caption-stage {

    height: var(--cap-band-height, 180px);

    align-items: center;
    justify-content: center;

  .caption-group {

    background: transparent;
    border: none;

  .caption-line {

  .caption-word.is-active {

    background: transparent;
    box-shadow: none;
  }

  .caption-word.is-spoken {
    color: #FFFFFF;
    background: transparent;

  .caption-word.cap-brand {
